# Name-based virtual hosts for the E2E sites. From the host, pick one with a Host header:
#   curl -H 'Host: single.test' http://127.0.0.1:8722/
ServerName apvm-e2e-target

<VirtualHost *:80>
	ServerName single.test
	DocumentRoot /var/www/single
</VirtualHost>

<VirtualHost *:80>
	ServerName multi.test
	DocumentRoot /var/www/multi
</VirtualHost>

<VirtualHost *:80>
	ServerName ftpsite.test
	DocumentRoot /home/ftpuser/public_html
	<Directory /home/ftpuser/public_html>
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
