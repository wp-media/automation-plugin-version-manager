[package]
name = "apvm-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Artifact storage management for APVM"
license = "MIT"

[dependencies]
# Date/time
chrono = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging and diagnostics
tracing = { workspace = true }

# Atomic file writes via temp file + persist (crash-safe manifest/artifact
# writes) and temp directories in tests.
tempfile = { workspace = true }

# NTFS junctions without admin privileges (replaces shelling out to
# `cmd /C mklink`, which is fragile and quoting-unsafe).
[target.'cfg(windows)'.dependencies]
junction = { workspace = true }
