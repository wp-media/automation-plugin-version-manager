[package]
name = "apvm-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "SQLite-backed artifact cache for APVM builds and release assets"
license = "MIT"

[dependencies]
# Date/time (timestamps are stored as epoch milliseconds, exposed as DateTime<Utc>)
chrono = { workspace = true }

# Embedded SQLite — the single source of truth for all cache metadata.
rusqlite = { workspace = true }

# SHA-256 hashing of artifacts while they are copied into the store.
sha2 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging and diagnostics
tracing = { workspace = true }

# Atomic file writes: artifacts are streamed to a temp file in the destination
# directory and renamed into place, so a crash never leaves a half-written
# artifact under its final name.
tempfile = { workspace = true }

[dev-dependencies]
# Integration tests exercise the store through real temp directories and
# poke the raw database to simulate corruption / future schemas.
chrono = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
