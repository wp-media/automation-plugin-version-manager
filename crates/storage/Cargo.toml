[package]
name = "apvm-storage"
version = "0.1.0"
edition = "2021"
description = "Artifact storage management for APVM"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
walkdir = "2.5"
