[package]
name = "apvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Sandy Figueroa <sandy@wp-media.me>"]
description = "Build and manage WordPress plugin versions"

[[bin]]
name = "apvm"
path = "src/main.rs"

[dependencies]
# Internal crates
apvm-config = { workspace = true }
apvm-core = { workspace = true }
apvm-storage = { workspace = true }

# CLI argument parsing
clap = { workspace = true }

# Async runtime (needed for #[tokio::main])
tokio = { workspace = true }

# Serialization (for config file I/O)
serde_json = { workspace = true }

# Logging and diagnostics (for CLI output)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Progress indicators
indicatif = { workspace = true }

# Platform directories (home, config, etc.)
directories = { workspace = true }
