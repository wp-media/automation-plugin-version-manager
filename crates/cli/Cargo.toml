[package]
name = "apvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Build and manage WordPress plugin versions"

[[bin]]
name = "apvm"
path = "src/main.rs"

[features]
# Build OpenSSL from source instead of linking against system libssl.
# Required for Linux cross-compilation (aarch64) and recommended for all
# Linux distribution builds to produce self-contained binaries with no
# runtime libssl.so dependency.
# https://docs.rs/openssl/latest/openssl/#vendored
vendored-openssl = ["dep:openssl"]

[dependencies]
# Internal crates
apvm-config = { workspace = true }
apvm-core = { workspace = true }
apvm-storage = { workspace = true }

# CLI argument parsing
clap = { workspace = true }

# Async runtime (needed for #[tokio::main])
tokio = { workspace = true }

# Serialization (config file I/O + the update-notifier state file)
serde = { workspace = true }
serde_json = { workspace = true }

# Logging and diagnostics (for CLI output)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Progress indicators
indicatif = { workspace = true }

# Platform directories (home, config, etc.)
directories = { workspace = true }

# Date/time (for `apvm cache clean --older-than` cutoffs)
chrono = { workspace = true }

# Semantic versioning (for update version comparison)
semver = { workspace = true }

# Cross-platform atomic binary self-replacement
self-replace = { workspace = true }

# SHA-256 checksums (for update integrity verification)
sha2 = { workspace = true }

# Temporary files (for staging downloaded binaries)
tempfile = { workspace = true }

# OpenSSL vendored build — only activated by the `vendored-openssl` feature.
# Compiles OpenSSL from source; statically linked into the binary.
openssl = { workspace = true, optional = true }

[dev-dependencies]
# `test-util` enables tokio's virtual clock (`start_paused`), used to test the
# background update-check timeout deterministically (no real 1.5s wait). Kept a
# dev-dependency so it is never compiled into the shipped binary — with resolver
# v3, dev-only features do not leak into normal or release builds.
tokio = { workspace = true, features = ["test-util"] }
