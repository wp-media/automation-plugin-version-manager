# Builds CLI binaries for all platforms and publishes them as GitHub Release assets.
#
# Triggered by pushing a SemVer tag `vX.Y.Z` (e.g. `v3.3.0`, `v3.4.0-rc.1`).
# Tag the commit CI produced for that version — the "chore: update NAPI
# binaries" commit on `develop` — so the tag also carries the matching `.node`
# binaries for consumers installing the package from git.
#
# Usage:
#   git tag -a v3.3.0 -m "apvm v3.3.0"
#   git push origin v3.3.0
#
# This creates a GitHub Release named "apvm v3.3.0" with 5 binaries + checksums.
# A tag with a pre-release suffix (`-rc.1`, `-beta.2`, …) is published as a
# pre-release and never marked "latest", so `apvm update` (which reads
# `/releases/latest`) does not offer it.

name: Release CLI

on:
  push:
    tags:
      # GitHub filter syntax, not a regex: a coarse pre-filter. The validate
      # job enforces strict SemVer.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#filter-pattern-cheat-sheet
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel an in-progress release — unlike CI, partial releases are worse
  # than waiting for a slow build to finish.
  cancel-in-progress: false

permissions:
  contents: write  # required to create releases and upload assets

env:
  RUST_BACKTRACE: 1

jobs:
  # ── Validate ─────────────────────────────────────────────────────────────
  # Fail fast before any build starts if the tag is not `v` + strict SemVer,
  # or if its version doesn't match the workspace version in Cargo.toml.
  # e.g. tag `v3.3.0` must match `version = "3.3.0"` in Cargo.toml.
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    # Job timeouts: well above the usual run time (validate <1 min, builds
    # 2-6 min, publish <1 min), so a hung step fails instead of burning
    # GitHub's 6-hour default.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - name: Check tag is SemVer and matches Cargo.toml
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Official SemVer 2.0.0 regex (https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string),
          # prefixed with `v`. Kept in a variable so bash does not re-quote it.
          SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "${TAG}" =~ ${SEMVER_RE} ]]; then
            echo "::error::Tag '${TAG}' is not a valid release tag (expected vX.Y.Z[-prerelease][+build], e.g. v3.3.0)"
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version:   ${TAG_VERSION}"
          echo "Cargo version: ${CARGO_VERSION}"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          # Capture group 4 is the pre-release part (`-rc.1`); build
          # metadata (`+…`) alone does not make a pre-release.
          PRERELEASE=false
          if [ -n "${BASH_REMATCH[4]}" ]; then PRERELEASE=true; fi
          echo "Pre-release:   ${PRERELEASE}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  # ── Build ────────────────────────────────────────────────────────────────
  # Build the CLI binary for each target platform.
  # Artifacts are uploaded for the release job to collect.
  build:
    needs: validate
    name: Build CLI (${{ matrix.settings.target }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: apvm
            artifact: apvm-darwin-arm64

          - target: x86_64-apple-darwin
            os: macos-latest
            binary: apvm
            artifact: apvm-darwin-x64

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: apvm
            artifact: apvm-linux-x64-gnu
            # Vendor OpenSSL to produce a self-contained binary with no runtime
            # libssl dependency. https://docs.rs/openssl/latest/openssl/#vendored
            features: vendored-openssl

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: apvm
            artifact: apvm-linux-arm64-gnu
            # Vendor OpenSSL from source for cross-compilation (no system
            # libssl-dev:arm64) and to produce a self-contained binary.
            # https://docs.rs/openssl/latest/openssl/#vendored
            features: vendored-openssl

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: apvm.exe
            artifact: apvm-win32-x64-msvc.exe
    runs-on: ${{ matrix.settings.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CLI
        run: >
          cargo build --release --locked -p apvm
          --target ${{ matrix.settings.target }}
          ${{ matrix.settings.features && format('--features {0}', matrix.settings.features) || '' }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

      - name: Rename to platform-specific name
        shell: bash
        run: >
          cp "target/${{ matrix.settings.target }}/release/${{ matrix.settings.binary }}"
          "${{ matrix.settings.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.settings.target }}
          path: ${{ matrix.settings.artifact }}
          if-no-files-found: error
          # Artifacts are transient — only needed to pass binaries to the
          # release job. 1 day is sufficient; default is 90 days.
          # https://github.com/actions/upload-artifact#inputs
          retention-days: 1

  # ── Release ──────────────────────────────────────────────────────────────
  # Collect all build artifacts, generate checksums, and create a GitHub Release.
  release:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: sha256sum apvm-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: apvm ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          # Pre-releases must never become "latest": `apvm update` and the
          # install scripts follow `/releases/latest`.
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/apvm-darwin-arm64
            artifacts/apvm-darwin-x64
            artifacts/apvm-linux-x64-gnu
            artifacts/apvm-linux-arm64-gnu
            artifacts/apvm-win32-x64-msvc.exe
            artifacts/checksums.txt
