name: CI

on:
  push:
    branches:
      - develop
      # TEMPORARY: runs CI on the long-lived site-deployment branch before its
      # PR exists. `commit-artifacts` stays develop-only. Removed by phase P12
      # of docs/plans/site-deployment.md once the branch is merged.
      - feat/site-deployment
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  NODE_VERSION: "24"
  # Disable husky git hooks in CI — CI runs its own checks
  # https://typicode.github.io/husky/how-to.html#ci-server-and-docker
  HUSKY: 0

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    # Job timeouts: several times the usual run time (check ~2 min, builds
    # 3-7 min, tests 5-9 min), so a hung step fails instead of burning
    # GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  build-napi:
    name: Build NAPI (${{ matrix.settings.target }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: apvm-napi.darwin-arm64.node
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: apvm-napi.darwin-x64.node
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: apvm-napi.linux-x64-gnu.node
            # Vendor OpenSSL to produce a self-contained binary with no runtime libssl dependency.
            # https://docs.rs/openssl/latest/openssl/#vendored
            features: vendored-openssl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: apvm-napi.linux-arm64-gnu.node
            # Vendor OpenSSL from source for cross-compilation (no system libssl-dev:arm64)
            # and to produce a self-contained binary with no runtime libssl dependency.
            # https://docs.rs/openssl/latest/openssl/#vendored
            features: vendored-openssl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: apvm-napi.win32-x64-msvc.node
    runs-on: ${{ matrix.settings.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      # `npm ci`: exactly the committed lockfile (which lists every
      # platform's native packages), failing if it drifts from package.json.
      - run: npm ci
      - name: Build NAPI
        run: >
          npx napi build --release --platform
          --manifest-path crates/napi/Cargo.toml --output-dir .
          --target ${{ matrix.settings.target }}
          ${{ matrix.settings.features && format('--features {0}', matrix.settings.features) || '' }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      - name: Upload .node artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-${{ matrix.settings.target }}
          path: ${{ matrix.settings.artifact }}
          if-no-files-found: error
      - name: Upload JS bindings
        if: matrix.settings.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: napi-bindings
          path: |
            index.js
            index.d.ts
          if-no-files-found: error

  test:
    name: Test (${{ matrix.settings.name }})
    needs: build-napi
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: Linux x64
            os: ubuntu-22.04
            napi-artifact: napi-x86_64-unknown-linux-gnu
          - name: macOS ARM64
            os: macos-latest
            napi-artifact: napi-aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            napi-artifact: napi-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.os }}
    # Includes real builds of wp-rocket and imagify from GitHub, each test
    # allowed 10 min: more room than the other jobs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable

      # PHP + Composer (required by wp-rocket and backwpup build steps).
      # Use shivammathur/setup-php to get a consistent PHP version on all runners.
      # ubuntu-22.04 ships PHP 8.1 (EOL, known allocator bugs causing SIGABRT),
      # so we install PHP 8.4 (latest stable with active support) everywhere.
      # https://github.com/shivammathur/setup-php
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # fileinfo: required by league/flysystem (transitive dep of wp-rocket via coenjacobs/mozart).
          #           Bundled by default on Linux/macOS but must be explicitly enabled on Windows.
          extensions: fileinfo
          tools: composer
          coverage: none
        env:
          fail-fast: true

      # Debug: print PHP and Composer info for troubleshooting
      - name: PHP & Composer diagnostics
        run: |
          php -v
          php -m
          composer --version
          composer diagnose || true

      - name: Install gulp
        run: npm install --global gulp-cli

      # Rust tests
      - name: Rust tests
        run: cargo test --workspace --locked

      # Node tests
      - name: Download NAPI binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.settings.napi-artifact }}
      # The committed index.js / index.d.ts lag behind this change (the bot
      # regenerates them only after merging), so test against the fresh ones.
      - name: Download JS bindings
        uses: actions/download-artifact@v8
        with:
          name: napi-bindings
      - run: npm ci
      # Type-checks the tests against the generated index.d.ts (OS-independent).
      - name: TypeScript typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck
      - name: Node tests
        run: npm test
        env:
          # Prevent PHP memory limit issues during Composer autoload generation.
          # wp-rocket has 95+ deps; the default 128MB can be insufficient.
          # https://getcomposer.org/doc/articles/troubleshooting.md#memory-limit-errors
          COMPOSER_MEMORY_LIMIT: "-1"

  # Site-deployment E2E harness: WordPress + WP-CLI behind OpenSSH and sudo in
  # Docker (tests/e2e/sites). verify.sh re-checks the ground truth the plan's
  # remote design relies on (docs/plans/site-deployment.md §3.5).
  e2e-sites:
    name: E2E sites harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint harness scripts
        run: shellcheck -x tests/e2e/sites/*.sh tests/e2e/sites/lib/*.sh tests/e2e/sites/checks/*.sh tests/e2e/sites/target/*.sh tests/support/fake-remote/fake-ssh tests/support/fake-remote/fake-sudo tests/support/fake-remote/fake-wp
      - uses: dtolnay/rust-toolchain@stable
      # Built before the harness starts, so a compile error fails fast.
      - name: Build the SSH transport, probe and CLI E2E tests
        run: |
          cargo test -p apvm-sites --locked --test ssh_e2e --test probe_e2e --no-run
          cargo test -p apvm --locked --test cli_remote_e2e --no-run
      - name: Start harness
        run: tests/e2e/sites/harness.sh up
      - name: Verify ground truth
        run: tests/e2e/sites/verify.sh
        env:
          # Outside the repo's dot-dirs: upload-artifact skips hidden paths.
          APVM_E2E_RESULTS_DIR: ${{ runner.temp }}/e2e-sites-results
      # apvm's SSH transport (plan P3.3) through this runner's OpenSSH client:
      # connect, unknown host key, accept-new, changed key, revoked key, wrong
      # key, a key file others can read, refused port, a jump host, a hostile
      # ssh_config, a timed-out call through a jump host, the default
      # ssh_config files (the runner's system one included). Gated on the
      # variables `harness.sh env` prints.
      # The assignment fails the step if `harness.sh env` fails; `eval "$(…)"`
      # would not, and every test would then skip and pass.
      - name: SSH transport E2E
        run: |
          harness_env=$(tests/e2e/sites/harness.sh env)
          eval "$harness_env"
          test "${APVM_E2E_SITES:-}" = 1
          cargo test -p apvm-sites --locked --test ssh_e2e
      # The probe (plan P4.2): every harness user's identity on each site,
      # every sudo refusal, a moved WP_PLUGIN_DIR (pinned and not), an explicit
      # owner, a hostile WP-CLI config and package, unusual login shells.
      # Tests that change a site reset it with `harness.sh reset`.
      - name: Probe E2E
        run: |
          harness_env=$(tests/e2e/sites/harness.sh env)
          eval "$harness_env"
          test "${APVM_E2E_SITES:-}" = 1
          cargo test -p apvm-sites --locked --test probe_e2e
      # The CLI's connection tests (plan P4.3) through the real binary:
      # `server test`, `site test` (identities, root stat, a missing sudoers
      # rule), an unknown host key refused then recorded with
      # --trust-new-host-key, and the probe on `site add`. Read-only.
      - name: CLI connection tests E2E
        run: |
          harness_env=$(tests/e2e/sites/harness.sh env)
          eval "$harness_env"
          test "${APVM_E2E_SITES:-}" = 1
          cargo test -p apvm --locked --test cli_remote_e2e
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-sites-results
          path: ${{ runner.temp }}/e2e-sites-results
          if-no-files-found: warn
      - name: Harness logs
        if: failure()
        run: tests/e2e/sites/harness.sh logs
      - name: Stop harness
        if: always()
        run: tests/e2e/sites/harness.sh down

  commit-artifacts:
    name: Commit Artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [build-napi, test]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download all NAPI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: napi-*
          merge-multiple: true
      - name: Commit and push artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- *.node index.js index.d.ts
          git diff --staged --quiet && exit 0
          git commit -m "chore: update NAPI binaries"
          git pull --rebase
          git push

  # ── CI gate ──────────────────────────────────────────────────────────────
  # Single required check for branch protection. With matrix strategies, job
  # names are dynamic (e.g. "Build NAPI (x86_64-unknown-linux-gnu)"). This
  # job provides one stable name — "CI" — to configure as a required status
  # check, so matrix changes never break branch protection rules.
  ci:
    name: CI
    if: always()
    needs: [check, build-napi, test, e2e-sites, commit-artifacts]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check results
        if: >-
          needs.check.result != 'success' ||
          needs.build-napi.result != 'success' ||
          needs.test.result != 'success' ||
          needs.e2e-sites.result != 'success' ||
          (needs.commit-artifacts.result != 'success' &&
           needs.commit-artifacts.result != 'skipped')
        run: exit 1
