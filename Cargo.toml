[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["rt", "macros", "process"] }

# GitHub API client
octocrab = "0.49"

# Git operations (pure Rust)
gix = { version = "0.77", features = ["blocking-network-client"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Error handling
thiserror = "2.0"

# Logging and diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Platform directories (config, cache, etc.)
directories = "6"

# CLI argument parsing
clap = { version = "4.5.54", features = ["derive"] }

# Date/time
chrono = { version = "0.4.43", features = ["serde"] }

# Hashing
sha2 = "0.10"

# File system utilities
walkdir = "2.5"
glob = "0.3"

# Process utilities
which = "8.0"

# Internal crates
apvm-config = { path = "crates/config" }
apvm-core = { path = "crates/core" }
apvm-storage = { path = "crates/storage" }

[profile.release]
lto = "fat"
codegen-units = 1
