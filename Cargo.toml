[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49", features = ["rt", "rt-multi-thread", "macros", "process"] }

# GitHub API client
octocrab = "0.49"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Error handling
thiserror = "2.0"

# Logging and diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Platform directories (config, cache, etc.)
directories = "6"

# CLI argument parsing
clap = { version = "4.5.58", features = ["derive", "color"] }

# Date/time
chrono = { version = "0.4.43", features = ["serde"] }

# Hashing
sha2 = "0.10"

# File system utilities
walkdir = "2.5"
glob = "0.3"

# Process utilities
which = "8.0"

# Progress indicators
indicatif = "0.18"

# Testing utilities
tempfile = "3.25"

# Internal crates
apvm-config = { path = "crates/config" }
apvm-core = { path = "crates/core" }
apvm-storage = { path = "crates/storage" }

# N-API bindings
napi = { version = "3.8.3", default-features = false, features = ["async", "napi8"] }
napi-derive = "3.5.2"
napi-build = "2.3.1"

[profile.release]
lto = "fat"
codegen-units = 1
