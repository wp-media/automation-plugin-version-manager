[workspace]
members = ["crates/*"]
# Resolver v3: edition 2024 default, MSRV-aware dep resolution (Rust 1.84+)
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
resolver = "3"

[workspace.package]
version = "3.1.1"
edition = "2024"
rust-version = "1.97.0"
authors = ["Sandy Figueroa <sandy@wp-media.me>"]

[workspace.dependencies]
# Async runtime
# https://docs.rs/tokio/1 — SemVer stable since 1.0
# "sync" enables tokio::sync::OnceCell, used to cache one `git ls-remote`
# snapshot per ref-resolution session.
# "time" enables tokio::time::timeout, used to bound the background
# update-check so a slow/hung network can never stall the CLI.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "sync", "time"] }

# GitHub API client
# https://crates.io/crates/octocrab — pre-1.0, 0.54.x is compatible range
octocrab = "0.54"

# Serialization
# https://docs.rs/serde/1 — SemVer stable since 1.0
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
# https://docs.rs/thiserror/2 — SemVer stable since 2.0
thiserror = "2"

# Logging and diagnostics
# https://docs.rs/tracing/0.1 — pre-1.0, 0.1.x is compatible range
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Platform directories (config, cache, etc.)
# https://docs.rs/directories/6 — SemVer stable since 6.0
directories = "6"

# CLI argument parsing
# https://docs.rs/clap/4 — SemVer stable since 4.0
clap = { version = "4", features = ["derive", "color"] }

# Date/time
# https://docs.rs/chrono/0.4 — pre-1.0, 0.4.x is compatible range
chrono = { version = "0.4", features = ["serde"] }

# Hashing
# https://docs.rs/sha2/0.11 — pre-1.0, 0.11.x is compatible range
sha2 = "0.11"

# File system utilities
# https://docs.rs/walkdir/2 — SemVer stable since 2.0
walkdir = "2"
glob = "0.3"

# Embedded SQLite with the C library compiled in (`bundled`) — no system
# dependency, identical behavior on every platform. Used by apvm-storage as
# the single metadata index for cached builds and release assets.
# https://docs.rs/rusqlite/0.40 — pre-1.0, 0.40.x is compatible range
rusqlite = { version = "0.40", features = ["bundled"] }

# ZIP archive creation
# https://docs.rs/zip/8 — SemVer stable since 2.0, latest 8.x
# default-features = false: only include deflate (no aes, bzip2, lzma, xz, zstd, time)
zip = { version = "8", default-features = false, features = ["deflate"] }

# Process utilities
# https://docs.rs/which/8 — SemVer stable since 8.0
which = "8"

# Progress indicators
# https://docs.rs/indicatif/0.18 — pre-1.0, 0.18.x is compatible range
indicatif = "0.18"

# Semantic versioning parser and comparator
# https://docs.rs/semver/1 — SemVer stable since 1.0
semver = "1"

# Cross-platform atomic binary self-replacement
# https://docs.rs/self-replace/1 — SemVer stable since 1.0
self-replace = "1"

# Testing utilities
# https://docs.rs/tempfile/3 — SemVer stable since 3.0
tempfile = "3"

# HTTP client (for release asset downloads)
# Uses native-tls to avoid crypto provider conflict with octocrab's rustls+ring
# https://docs.rs/reqwest/0.13 — pre-1.0, 0.13.x is compatible range
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

# OpenSSL vendored build (for Linux cross-compilation)
# When the `vendored-openssl` feature is enabled, openssl-sys builds OpenSSL
# from source using the target's C cross-compiler instead of requiring system
# libraries. Only needed for CI cross-compile (aarch64-unknown-linux-gnu).
# https://docs.rs/openssl/latest/openssl/#vendored
openssl = { version = "0.10", features = ["vendored"] }

# Internal crates
apvm-config = { path = "crates/config" }
apvm-core = { path = "crates/core" }
apvm-storage = { path = "crates/storage" }

# N-API bindings
# https://docs.rs/napi/3 — SemVer stable since 3.0
napi = { version = "3", default-features = false, features = ["async", "napi8"] }
napi-derive = "3"
napi-build = "2"

[profile.release]
lto = "fat"
codegen-units = 1
# Remove debug symbols from release binaries — reduces size by ~15%.
# Applies to all workspace crates (CLI, NAPI, etc.).
# Stable since Rust 1.59. https://doc.rust-lang.org/cargo/reference/profiles.html#strip
strip = "symbols"
