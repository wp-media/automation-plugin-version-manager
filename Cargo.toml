[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "macros", "process"] }

# GitHub API client
octocrab = "0.48.1"

# Git operations (pure Rust)
gix = { version = "0.75.0", features = ["blocking-network-client"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging and diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Platform directories (config, cache, etc.)
directories = "6"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Internal crates
apvm-config = { path = "crates/config" }
apvm-core = { path = "crates/core" }
apvm-storage = { path = "crates/storage" }

[profile.release]
lto = "fat"
codegen-units = 1
